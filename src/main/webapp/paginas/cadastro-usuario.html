<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<title>Cadastro de Usuario</title>
</head>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #fdf4e5;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 90vh;
}

.cadastro {
    text-align: center;
}

h1 {
    font-size: 2.5rem;
    color: #333;
    margin-bottom: 20px;
}

.pagina {
    background-color: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    padding: 20px;
    width: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    position: relative;
}

form {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 100%;
}

.input-form {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

label {
    font-size: 1rem;
    color: #333;
    text-align: left;
}

input, select {
    padding: 10px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    padding: 10px;
    background-color: #8fbc8f;
    color: black;
    border: none;
    border-radius: 5px;
    font-size: 1rem;
    cursor: pointer;
}

button:hover {
    background-color: #18ac1f;
}

.icon {
    width: 100px;
    height: auto;
    position: absolute;
    bottom: 10px;
    right: 10px;
}
</style>



<body>

	<div class="pagina">
		<h1>Registre-se</h1>
		<div class="cadastro">
			<form action="%=request.getContextPath()%>/inserir-doador" method="post">
				<div class="input-form">
					<div>
						<label for="apelido">Apelido*</label>
					</div>
					<div>
						<input type="text" id="apelido" name="apelido" required>
					</div>
				</div>

				<div class="input-form">
					<div>
						<label for="nome">Nome*</label>
					</div>
					<div>
						<input type="text" id="nome" name="nome" required>
					</div>
				</div>

				<div class="input-form">
					<div>
						<label for="cpf">CPF*</label>
					</div>
					<div>
						<input type="text" id="cpf" name="cpf" maxlength="11" size="11" placeholder="xxx.xxx.xxx-xx" required>
					</div>
				</div>

				<div class="input-form">
					<div>
						<label for="tipo-sanguineo">Tipo Sanguineo*</label>
					</div>
					<div>
						<select id="tipo-sanguineo" name="tipo-sanguineo" required>
							<option value="">Selecione</option>
							<option value="a-positivo">A+</option>
							<option value="a-negativo">A-</option>
							<option value="b-positivo">B+</option>
							<option value="b-negativo">B-</option>
							<option value="ab-positivo">AB+</option>
							<option value="ab-negativo">AB-</option>
							<option value="o-positivo">O+</option>
							<option value="o-negativo">O-</option>

						</select>
					</div>
				</div>

				<div class="input-form">
					<div>
						<label for="data-nascimento">Data de Nascimento*</label>
					</div>
					<div>
						<input type="date" id="data-nascimento" name="data-nascimento" required>
					</div>
				</div>

				<div class="input-form">
					<div>
						<label for="telefone">Telefone*</label>
					</div>
					<div>
						<input type="text" id="telefone" name="telefone" maxlength="13" size="13" required>
					</div>
				</div>

				<div class="input-form">
					<div>
						<label for="sexo">Sexo*</label>
					</div>
					<div>
						<select id="sexo" name="sexo" required>
							<option value="">Selecione</option>
							<option value="Masculino">M</option>
							<option value="Feminino">F</option>
						</select>
					</div>
				</div>

				<div class="input-form">
					<div>
						<label for="email">Email*</label>
					</div>
					<div>
						<input type="text" id="email" name="email" required>
					</div>
				</div>

				<div class="input-form">
					<div>
						<label for="senha">Senha*</label>
					</div>
					<div>
						<input type="password" id="senha" name="senha" required>
					</div>
				</div>

				<div class="input-form">
					<div>
						<label for="confirmar-senha">Confirmação de senha*</label>
					</div>
					<div>
						<input type="password" id="confirmar-senha" name="confirmar-senha" required>
					</div>
				</div>
				<div class="input-form">
					<form action="dados-usuario">
						<button type="submit" class="button" value="Continuar">Continuar</button>
					</form>
				</div>
			</form>
		</div>
	</div>

</body>

</html>
